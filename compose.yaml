name: cloudvault

services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run env:init first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init first}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run env:init first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    build:
      context: ./infra/minio
      target: server
    image: cloudvault-minio:2025-10-15
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run npm run env:init first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run npm run env:init first}
      MINIO_REGION_NAME: ${S3_REGION:?Run npm run env:init first}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_PUBLIC_URL:?Run npm run env:init first}
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  minio-init:
    build:
      context: ./infra/minio
      target: client
    image: cloudvault-minio-client:2025-08-13
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run npm run env:init first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run npm run env:init first}
      S3_BUCKET: ${S3_BUCKET:?Run npm run env:init first}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run npm run env:init first}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run npm run env:init first}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    restart: "no"

volumes:
  postgres-data:
  minio-data:
